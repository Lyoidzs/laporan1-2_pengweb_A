<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITPLN Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Moh Naufal Demas Hartono_202432013 -->

    <!-- CSS -->
    <link rel="stylesheet" href="style4.css">
</head>

<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">

            <a class="navbar-brand" href="akun.html">
                ITPLN Portal
            </a>

            <button 
                class="navbar-toggler" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="menu">

                <div class="navbar-nav">

                    <a class="nav-link" href="inventaris.html">
                        Inventaris
                    </a>

                    <a class="nav-link" href="stok.html">
                        Stok
                    </a>

                    <a class="nav-link" href="pendaftaran.html">
                        Pendaftaran
                    </a>

                    <a class="nav-link active" href="index.html">
                        Portal Akun
                    </a>

                </div>

            </div>

        </div>
    </nav>

    <!-- Moh Naufal Demas Hartono_202432013 -->
     
    <!-- Login -->
    <div class="container vh-100 d-flex align-items-center justify-content-center">

        <div class="card bg-secondary border-0 shadow-lg login-card">

            <div class="card-body p-4 text-center">

                <h2 class="mb-4 text-dark">
                    Autentikasi Akun
                </h2>

                <form>

                    <div class="input-group mb-3">

                        <span class="input-group-text">
                            @
                        </span>

                        <input 
                            type="text" 
                            class="form-control" 
                            placeholder="NIM Mahasiswa"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <input 
                            type="password" 
                            class="form-control" 
                            placeholder="Kata Sandi"
                            required
                        >

                    </div>

                    <div class="d-grid">

                        <button class="btn btn-warning fw-bold">
                            Masuk Sistem
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
